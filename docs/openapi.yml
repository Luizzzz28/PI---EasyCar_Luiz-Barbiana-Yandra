components:
  schemas:
    Aluguel:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        perfil_cliente:
          type: integer
        cliente:
          type: string
          readOnly: true
        carro:
          type: integer
        placa:
          type: string
          readOnly: true
        funcionario:
          type: string
          readOnly: true
        data_inicio:
          type: string
          format: date
          title: Data de início
        data_fim:
          type: string
          format: date
          title: Data de fim prevista
        valor:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        status:
          allOf:
          - $ref: '#/components/schemas/StatusAluguelEnum'
          readOnly: true
        data_devolucao:
          type: string
          format: date
          readOnly: true
          nullable: true
          title: Data de devolução
      required:
      - carro
      - cliente
      - data_devolucao
      - data_fim
      - data_inicio
      - funcionario
      - id
      - perfil_cliente
      - placa
      - status
      - valor
    AluguelDetalhado:
      type: object
      description: Aluguel com os dados completos do carro (rotas de relacionamento).
      properties:
        id:
          type: integer
          readOnly: true
        perfil_cliente:
          type: integer
        cliente:
          type: string
          readOnly: true
        carro:
          allOf:
          - $ref: '#/components/schemas/Carro'
          readOnly: true
        placa:
          type: string
          readOnly: true
        funcionario:
          type: string
          readOnly: true
        data_inicio:
          type: string
          format: date
          title: Data de início
        data_fim:
          type: string
          format: date
          title: Data de fim prevista
        valor:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        status:
          allOf:
          - $ref: '#/components/schemas/StatusAluguelEnum'
          readOnly: true
        data_devolucao:
          type: string
          format: date
          readOnly: true
          nullable: true
          title: Data de devolução
      required:
      - carro
      - cliente
      - data_devolucao
      - data_fim
      - data_inicio
      - funcionario
      - id
      - perfil_cliente
      - placa
      - status
      - valor
    AuthToken:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
          title: Nome de usuário
        password:
          type: string
          writeOnly: true
          title: Senha
        token:
          type: string
          readOnly: true
      required:
      - password
      - token
      - username
    Carro:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        modelo:
          type: string
          maxLength: 100
        placa:
          type: string
          maxLength: 10
        ano:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        status:
          $ref: '#/components/schemas/StatusCarroEnum'
      required:
      - ano
      - id
      - modelo
      - placa
    Funcionario:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          title: Usuário
          description: Obrigatório. 150 caracteres ou menos. Letras, números e @/./+/-/_
            apenas.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        first_name:
          type: string
          title: Primeiro nome
          maxLength: 150
        last_name:
          type: string
          title: Último nome
          maxLength: 150
        email:
          title: Endereço de email
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
      required:
      - id
      - username
    Multa:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        aluguel:
          type: integer
        funcionario:
          type: integer
        valor:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        motivo:
          type: string
          title: Motivo da multa
          maxLength: 500
        data_infracao:
          type: string
          format: date
          title: Data da infração
        status:
          $ref: '#/components/schemas/MultaStatusEnum'
        dias_atrasos:
          type: integer
          maximum: 9223372036854775807
          minimum: 1
          format: int64
          title: Qtd de dias atrasados
        data_pagamento:
          type: string
          format: date
          nullable: true
          title: Data de pagamento
      required:
      - aluguel
      - data_infracao
      - dias_atrasos
      - funcionario
      - id
      - motivo
      - valor
    MultaStatusEnum:
      enum:
      - pendente
      - pago
      - abonado
      type: string
      description: |-
        * `pendente` - Pendente
        * `pago` - Pago
        * `abonado` - Abonado
