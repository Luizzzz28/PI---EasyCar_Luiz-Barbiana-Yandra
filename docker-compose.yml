# Sobe API + PostgreSQL localmente, igual à produção:  docker compose up --build
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: easycar
      POSTGRES_USER: easycar
      POSTGRES_PASSWORD: easycar
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U easycar -d easycar"]
      interval: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DJANGO_SECRET_KEY: troque-em-producao
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DB_ENGINE: postgres
      POSTGRES_DB: easycar
      POSTGRES_USER: easycar
      POSTGRES_PASSWORD: easycar
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
