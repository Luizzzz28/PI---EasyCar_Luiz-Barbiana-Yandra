services:
  - type: web
    name: easycar-aluguel-carros
    runtime: python
    plan: free
    region: ohio
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && python -m gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /carros/
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.14
      - key: DJANGO_DEBUG
        value: "0"
      - key: DB_ENGINE
        value: postgres
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "true"
      - key: DJANGO_USE_X_FORWARDED_PROTO
        value: "true"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
