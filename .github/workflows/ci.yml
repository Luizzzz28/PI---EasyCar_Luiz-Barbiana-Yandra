name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install ruff==0.17.4
      - run: ruff check .

  test:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]   # o mesmo SQL precisa passar nos dois
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: easycar
          POSTGRES_USER: easycar
          POSTGRES_PASSWORD: easycar
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U easycar" --health-interval 5s --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only
      DJANGO_DEBUG: '0'
      DB_ENGINE: ${{ matrix.db }}
      POSTGRES_DB: easycar
      POSTGRES_USER: easycar
      POSTGRES_PASSWORD: easycar
      POSTGRES_HOST: localhost
      POSTGRES_PORT: '5432'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Checagens do Django
        run: |
          python manage.py check --deploy --fail-level ERROR
          python manage.py makemigrations --check --dry-run
      - run: pytest

  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5   # gera tags em minúsculas (exigência do GHCR)
        with:
          images: ghcr.io/${{ github.repository_owner }}/easycar
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}   # PR só builda; main publica
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
